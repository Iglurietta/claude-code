          <ellipse cx="64" cy="60" rx="24" ry="14" transform="rotate(22 64 60)" fill="#E3A82B" />

    </style>

    <script>
      (function () {
        const S = '[data-composition-id="s2-riechzellen"] ';
        const q = (sel) => document.querySelector(S + sel);
        const qa = (sel) => document.querySelectorAll(S + sel);
        const tl = gsap.timeline({ paused: true });
        const pop = { ease: "back.out(2)", duration: 0.35 };

        // Hintergrund-Punktraster driftet die ganze Szene
        tl.fromTo(q(".dots"), { y: 0 }, { y: -108, duration: 5, ease: "none" }, 0);

        // "Du hast rund 6 Millionen Riechzellen."
        tl.fromTo(q(".label .w"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, ...pop }, 0.1);
        tl.fromTo(q(".tag .w"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, ...pop }, 0.25);
        tl.fromTo(q(".small-circle"), { scale: 0 }, { scale: 1, ...pop, duration: 0.45 }, 0.3);
        tl.fromTo(q(".count-small"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, ...pop }, 0.5);
        const c6 = { v: 0 };
        tl.to(c6, { v: 6, duration: 0.8, ease: "power2.out", onUpdate: () => (q(".n6").textContent = Math.round(c6.v)) }, 0.55);
        tl.to(q(".small-circle"), { y: -10, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.9);

        // "Dein Hund?"
        tl.fromTo(q(".vs"), { opacity: 0, scale: 2.2, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, ...pop }, 1.65);
        qa(".tag-dog .w").forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, y: 30 }, { opacity: 1, y: 0, ...pop }, 1.9 + i * 0.14);
        });

        // Riesiger senfgelber Kreis füllt sich von rechts ...
        tl.fromTo(q(".big-circle"), { scale: 0, x: 300, y: -40 }, { scale: 0.42, x: 300, y: -40, duration: 0.4, ease: "back.out(2)" }, 2.05);
        // ... wächst und drückt den kleinen Kreis aus dem Bild
        tl.to(q(".big-circle"), { scale: 1, x: 0, y: 0, duration: 0.7, ease: "expo.inOut" }, 2.4);
        tl.to([q(".human"), q(".vs")], { x: -760, rotation: -14, duration: 0.6, ease: "expo.in" }, 2.45);

        // "Bis zu 300 Millionen." – Zähler rast hoch
        tl.fromTo(q(".nose-mini"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, ...pop }, 2.85);
        tl.fromTo(q(".bis"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, ...pop }, 2.95);
        tl.fromTo(q(".n300"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ...pop }, 3.0);
        const c300 = { v: 0 };
        tl.to(c300, { v: 300, duration: 0.9, ease: "expo.out", onUpdate: () => (q(".n300").textContent = Math.round(c300.v)) }, 3.0);
        tl.fromTo(q(".mio"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, ...pop }, 3.5);
        tl.to(q(".n300"), { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 3.9);

        // Haltebewegung: gestrichelter Ring dreht, Nase schnüffelt
        tl.fromTo(q(".ring"), { opacity: 0, scale: 0.9, rotation: 0 }, { opacity: 0.7, scale: 1, rotation: 30, duration: 2.1, ease: "power1.out" }, 2.9);
        tl.to(q(".nose-mini"), { scaleY: 0.85, duration: 0.08, yoyo: true, repeat: 3, ease: "power2.inOut" }, 3.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-riechzellen"] = tl;
      })();
    </script>
