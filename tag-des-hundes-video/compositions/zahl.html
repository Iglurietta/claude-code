  <script>
    const tl = gsap.timeline({ paused: true });
    const wert = document.querySelector("#zahl-wert-in");
    const zaehler = { n: 0 };
    const format = (n) => String(Math.round(n / 1000) * 1000).replace(/\B(?=(\d{3})+(?!\d))/g, "'");

    tl.fromTo("#zahl-wipe-ein", { xPercent: 0 }, { xPercent: 100, duration: 0.5, ease: "power3.out" }, 0);

    tl.fromTo("#zahl-kreis", { scale: 0 }, { scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 0.15);
    tl.fromTo("#zahl-ueber-in", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);

    // Zähler 0 → 500'000 (rein zeitabhängig, daher beim Seeken stabil)
    tl.fromTo(
      zaehler,
      { n: 0 },
      {
        n: 500000,
        duration: 1.6,
        ease: "power2.out",
        onUpdate: () => {
          wert.textContent = format(zaehler.n);
        },
      },
      0.4,
    );
    tl.fromTo("#zahl-wert-in", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.4);
    tl.fromTo("#zahl-wert-in", { scale: 1 }, { scale: 1.08, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 2.0);

    tl.fromTo("#zahl-label-in", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.4);
    tl.fromTo("#zahl-text-in", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.75);

    tl.fromTo("#zahl-wipe-aus", { xPercent: -100 }, { xPercent: 0, duration: 0.45, ease: "power3.in" }, 5.0);
    window.__timelines["zahl"] = tl;
